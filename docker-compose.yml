services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DATABASE_URL=sqlite:///quiz.db
      - FLASK_ENV=production
      - DEMO_MODE=${DEMO_MODE:-true}
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
